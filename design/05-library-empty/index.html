<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=393, initial-scale=1.0">
  <title>Library - empty state</title>
  <!-- Google Fonts: Outfit and Fraunces -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            pagewell: {
              bg: '#FAF4FC',
              surface: '#FFFFFF',
              surfaceAlt: '#F3E8F6',
              accent: '#C64BE0',
              accentFill: '#A337BA',
              accentPressed: '#9B3BAF',
              accentTint: '#F6E4FA',
              textPrimary: '#1C0C1F',
              textSecondary: '#574A5A',
              textTertiary: '#76687A',
              borderHairline: '#EADCEE',
              borderControl: '#B085B4',
            }
          },
          fontFamily: {
            sans: ['Outfit', 'sans-serif'],
            display: ['Fraunces', 'serif'],
          },
          boxShadow: {
            'card-soft': '0 1px 2px rgba(28,12,31,0.04), 0 8px 24px rgba(28,12,31,0.06)',
            'img-soft': '0 4px 16px rgba(28,12,31,0.08)',
          }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: 'Outfit', sans-serif;
      background-color: #FAF4FC;
      color: #1C0C1F;
      -webkit-font-smoothing: antialiased;
    }
    .font-fraunces {
      font-family: 'Fraunces', serif;
    }
  </style>
</head>
<body class="flex justify-center items-start min-h-screen bg-[#FAF4FC] p-0 m-0">

  <!-- Mobile Container: 393px wide, 852px min-height -->
  <div class="w-[393px] h-[852px] bg-[#FAF4FC] flex flex-col justify-between relative overflow-hidden shadow-2xl select-none">

    <!-- Top Area: Status Bar + Header + Filter Controls -->
    <div class="w-full flex flex-col pt-3 px-5 z-10">
      
      <!-- iOS Status Bar (approx 44px) -->
      <div class="w-full h-8 flex justify-between items-center text-xs font-semibold text-[#1C0C1F] tracking-tight mb-2">
        <span>9:41</span>
        <div class="flex items-center space-x-1.5">
          <!-- Cellular signal -->
          <svg class="w-3.5 h-3.5 fill-current" viewBox="0 0 24 24">
            <path d="M12 3c-4.97 0-9 4.03-9 9 0 2.12.74 4.07 1.97 5.61L4.35 18.23C2.9 16.48 2 14.34 2 12 2 6.48 6.48 2 12 2s10 4.48 10 10c0 2.34-.9 4.48-2.35 6.23l-.62-.62C20.26 16.07 21 14.12 21 12c0-4.97-4.03-9-9-9zm-6 9c0-3.31 2.69-6 6-6s6 2.69 6 6c0 1.55-.59 2.97-1.56 4.04l-.73-.73C16.4 14.5 17 13.32 17 12c0-2.76-2.24-5-5-5s-5 2.24-5 5c0 1.32.6 2.5 1.29 3.31l-.73.73C6.59 14.97 6 13.55 6 12zm3 0c0-1.66 1.34-3 3-3s3 1.34 3 3c0 .82-.33 1.56-.88 2.12l-.71-.71C13.78 13.04 14 12.55 14 12c0-1.1-.9-2-2-2s-2 .9-2 2c0 .55.22 1.04.59 1.41l-.71.71C9.33 13.56 9 12.82 9 12zm3-1c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1z" opacity="0"/>
            <rect x="2" y="16" width="3" height="5" rx="1" fill="currentColor"/>
            <rect x="7" y="12" width="3" height="9" rx="1" fill="currentColor"/>
            <rect x="12" y="8" width="3" height="13" rx="1" fill="currentColor"/>
            <rect x="17" y="4" width="3" height="17" rx="1" fill="currentColor"/>
          </svg>
          <!-- Wifi -->
          <svg class="w-3.5 h-3.5 fill-current" viewBox="0 0 24 24">
            <path d="M12 4C7.31 4 3.07 5.9 0 8.98L12 21 24 8.98C20.93 5.9 16.69 4 12 4zm0 3.5c3.78 0 7.21 1.48 9.77 3.89L12 19.34 2.23 11.39C4.79 8.98 8.22 7.5 12 7.5z"/>
          </svg>
          <!-- Battery -->
          <svg class="w-5 h-3.5 fill-current" viewBox="0 0 24 24">
            <rect x="2" y="6" width="18" height="12" rx="2.5" fill="none" stroke="currentColor" stroke-width="2"/>
            <rect x="4" y="8" width="13" height="8" rx="1.5" fill="currentColor"/>
            <path d="M21 10v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </div>
      </div>

      <!-- App Header: Display title in Fraunces 32 + User Avatar -->
      <div class="flex justify-between items-center mt-2 mb-4">
        <h1 class="font-fraunces text-[32px] font-bold text-[#1C0C1F] tracking-[-0.02em] leading-none">
          Library
        </h1>
        <div class="w-10 h-10 rounded-full overflow-hidden border-2 border-white shadow-sm ring-1 ring-[#FAF4FC] flex-shrink-0">
          <img src="https://lh3.googleusercontent.com/aida/ALJJyrAm8ij0dFgb_PcUcSBKJzKpSCJpLRssvor_0Kz9nPE7DzfbD-gT3eFCMWaSa1F0fZgwLeJ5rVBxOjxCokIPONn-L19u1hP8tchQjXGjP7V4csBwf1cgsj2tvJX256UwMxm6i_KSsIJm7r68LX7k88LksMhibSf8OG-kfSJm3A0oHj_fHVIPMS0_p6JFfUcO85oj5wMDbWxupYbYQvpF9zrnqpW49oojrSrNGMSSUaaTXmx6yCJu5xA3-Q" alt="Ava Morgan" class="w-full h-full object-cover">
        </div>
      </div>

      <!-- Segmented Control: All | Ebooks | Audiobooks -->
      <div class="w-full bg-[#F3E8F6] p-1 rounded-full flex items-center justify-between">
        <button class="flex-1 py-1.5 px-3 bg-white rounded-full shadow-sm text-center text-[13px] font-semibold text-[#1C0C1F] transition-all">
          All
        </button>
        <button class="flex-1 py-1.5 px-3 text-center text-[13px] font-medium text-[#574A5A] hover:text-[#1C0C1F] transition-all">
          Ebooks
        </button>
        <button class="flex-1 py-1.5 px-3 text-center text-[13px] font-medium text-[#574A5A] hover:text-[#1C0C1F] transition-all">
          Audiobooks
        </button>
      </div>

    </div>

    <!-- Centered Empty State Content Area -->
    <div class="flex-1 flex flex-col items-center justify-center px-6 -mt-3 text-center z-10">
      
      <!-- Shelf & Plant Photographic Visual (Design system compliant real photography) -->
      <div class="w-52 h-44 rounded-2xl overflow-hidden shadow-card-soft border border-[#EADCEE] mb-6 bg-white relative">
        <img 
          src="https://lh3.googleusercontent.com/aida-public/AB6AXuAu9rYs-h7j5yaK8guqcuAu6iBg_8fbfa-i64vS7uhIHAZ2sVd3LkNtcYwRzMwkpBtwJWSOXQRwuLwsSTbvcPYYE9CGwWfCVz7V8BJl5AAjgVi_6eMWTiGXSHKYUiJYGBVsl_9owQvwSKdwbrRLgvb74W1w3Ltbm5QPBlYskSEN8ElYRny_pB6ExegG6czbg18hiVGGP4IoBXTFJmrtCK4-Ink5beuhQc2temhAATPSao7dSEd7be2ZXjA9Bbx4bx_LeFjDjbMm3OE" 
          alt="Empty light wooden bookshelf with a small green plant in soft daylight" 
          class="w-full h-full object-cover object-center"
        >
        <!-- Gentle natural ambient highlight border -->
        <div class="absolute inset-0 rounded-2xl border border-white/40 pointer-events-none"></div>
      </div>

      <!-- Heading: Fraunces 20 Title -->
      <h2 class="font-fraunces text-[20px] font-semibold text-[#1C0C1F] tracking-[-0.01em] mb-2 leading-snug">
        Your shelf is empty
      </h2>

      <!-- Description / Body -->
      <p class="font-sans text-[15px] font-normal text-[#574A5A] leading-relaxed max-w-[270px] mb-7">
        Add a free ebook or audiobook to start reading and listening.
      </p>

      <!-- Primary Action Pill Button: #A337BA, 56px height, white text -->
      <button class="w-full max-w-[280px] h-14 bg-[#A337BA] hover:bg-[#9B3BAF] active:scale-[0.98] transition-all duration-150 rounded-full flex items-center justify-center text-white text-[14px] font-medium tracking-wide shadow-card-soft">
        Browse free titles
      </button>

      <!-- Secondary Text Link: Restore purchases -->
      <button class="mt-4 py-2 px-4 text-[13px] font-medium text-[#574A5A] hover:text-[#A337BA] transition-colors">
        Restore purchases
      </button>

    </div>

    <!-- Bottom Tab Bar (Pinned at bottom, exactly 5 tabs in specified order) -->
    <div class="w-full bg-white border-t border-[#EADCEE] flex items-center justify-around pt-2.5 pb-6 px-3 z-20">
      
      <!-- 1. Today (Inactive) -->
      <button class="flex flex-col items-center justify-center flex-1 py-1 group">
        <div class="w-10 h-7 flex items-center justify-center rounded-full text-[#574A5A] group-hover:text-[#1C0C1F] transition-colors">
          <!-- Sun Icon (Outline 24px) -->
          <svg class="w-6 h-6 stroke-current" fill="none" stroke-width="1.75" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 2v2"/>
            <path d="M12 20v2"/>
            <path d="m4.93 4.93 1.41 1.41"/>
            <path d="m17.66 17.66 1.41 1.41"/>
            <path d="M2 12h2"/>
            <path d="M20 12h2"/>
            <path d="m6.34 17.66-1.41 1.41"/>
            <path d="m19.07 4.93-1.41 1.41"/>
          </svg>
        </div>
        <span class="text-[11px] font-medium text-[#574A5A] mt-0.5">Today</span>
      </button>

      <!-- 2. Library (Active: #A337BA with #F6E4FA pill behind icon) -->
      <button class="flex flex-col items-center justify-center flex-1 py-1">
        <div class="w-11 h-7 flex items-center justify-center rounded-full bg-[#F6E4FA] text-[#A337BA]">
          <!-- Library / Books Icon (Outline 24px) -->
          <svg class="w-5 h-5 stroke-current" fill="none" stroke-width="1.85" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
            <path d="m16 6 4 14"/>
            <path d="M12 6v14"/>
            <path d="M8 8v12"/>
            <path d="M4 4v16"/>
          </svg>
        </div>
        <span class="text-[11px] font-semibold text-[#A337BA] mt-0.5">Library</span>
      </button>

      <!-- 3. Search (Inactive) -->
      <button class="flex flex-col items-center justify-center flex-1 py-1 group">
        <div class="w-10 h-7 flex items-center justify-center rounded-full text-[#574A5A] group-hover:text-[#1C0C1F] transition-colors">
          <!-- Search Icon (Outline 24px) -->
          <svg class="w-6 h-6 stroke-current" fill="none" stroke-width="1.75" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"/>
            <path d="m21 21-4.3-4.3"/>
          </svg>
        </div>
        <span class="text-[11px] font-medium text-[#574A5A] mt-0.5">Search</span>
      </button>

      <!-- 4. Saved (Inactive) -->
      <button class="flex flex-col items-center justify-center flex-1 py-1 group">
        <div class="w-10 h-7 flex items-center justify-center rounded-full text-[#574A5A] group-hover:text-[#1C0C1F] transition-colors">
          <!-- Bookmark / Saved Icon (Outline 24px) -->
          <svg class="w-6 h-6 stroke-current" fill="none" stroke-width="1.75" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
            <path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"/>
          </svg>
        </div>
        <span class="text-[11px] font-medium text-[#574A5A] mt-0.5">Saved</span>
      </button>

      <!-- 5. Profile (Inactive) -->
      <button class="flex flex-col items-center justify-center flex-1 py-1 group">
        <div class="w-10 h-7 flex items-center justify-center rounded-full text-[#574A5A] group-hover:text-[#1C0C1F] transition-colors">
          <!-- User / Profile Icon (Outline 24px) -->
          <svg class="w-6 h-6 stroke-current" fill="none" stroke-width="1.75" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
        </div>
        <span class="text-[11px] font-medium text-[#574A5A] mt-0.5">Profile</span>
      </button>

    </div>

  </div>

</body>
</html>
