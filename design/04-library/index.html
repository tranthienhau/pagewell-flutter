      <!-- Book 6: North of Quiet (Mara Ellis) - Premium badge -->

    <!-- Pinned Bottom Tab Bar (Fixed to 393px container width) -->
    <!-- Exactly 5 tabs in order: Today, Library, Search, Saved, Profile -->

    <div class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-[393px] bg-white border-t border-[#EADCEE] px-4 pt-2 pb-6 z-30 flex items-center justify-between">
