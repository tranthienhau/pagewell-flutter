<style>

<body class="bg-background text-text-primary antialiased min-h-full flex justify-center selection:bg-accent-tint selection:text-primary">
<!-- Mobile Device Container (393px width reference) -->
<main class="w-full max-w-[393px] min-h-screen bg-background flex flex-col justify-between px-margin pt-[59px] pb-[34px] relative">
<!-- Top Bar / Action Bar -->
<header class="flex justify-between items-center w-full mb-space-lg">
<button aria-label="Go back" class="w-10 h-10 -ml-1 rounded-full flex items-center justify-center text-text-primary hover:bg-surface-alt active:opacity-80 transition-colors" type="button">
<span class="material-symbols-outlined text-[24px]">arrow_back</span>
</button>
<span class="font-headline text-headline text-text-primary select-none font-semibold tracking-tight">
        Pagewell
      </span>
<button class="font-label text-label text-text-secondary hover:text-primary transition-colors py-1.5 px-2 active:opacity-80" type="button">
        Help
      </button>
</header>
<!-- Content Card / Form Body -->
<div class="flex-1 flex flex-col justify-start">
<!-- Editorial Header Section -->
<section class="flex flex-col items-start mt-space-sm mb-space-xl">
<!-- Accent Photography Hero Pill -->
<div class="relative mb-space-lg">
<div class="w-[68px] h-[68px] rounded-full overflow-hidden p-0.5 bg-surface shadow-avatar ring-1 ring-hairline-divider">
<img alt="An open paperback novel lying quietly on a soft textured linen sheet beside a speckled ceramic teacup" class="w-full h-full object-cover rounded-full" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAryngxBXzZVTHKsE-meaSTNdo4AgV3j1zWpZdouJoYgYkyadTZiaSwEeIGhSsvlcETIQMPaFjErHojEeRBAEoIXBZCYsJLktAGiNq8BUfsgIAt-sZinufUUIt2e9pWuV0gmKmaOoowtt5qA9x-k1Injjb8JmZXVraggMPG7ZrSNYGqte7281arfstZmSZ7nMy3-k2Fw-hvqJGYeMgsrhtFOJL_wYndSFFYhZBn1AWeuIEJmPAutpD2TUxttXBRsXyso3Dh9IcLbDc"/>
</div>
<div class="absolute -bottom-1 -right-1 w-6 h-6 rounded-full bg-accent-tint border border-surface flex items-center justify-center text-primary shadow-sm">
<span class="material-symbols-outlined text-[14px]" style="font-variation-settings: 'FILL' 1;">auto_stories</span>
</div>
</div>
<!-- Typography Headline & Descriptor -->
<h1 class="font-display text-display text-text-primary leading-tight tracking-[-0.02em] mb-space-xs">
          Welcome back
        </h1>
<p class="font-body text-[15px] leading-relaxed text-text-secondary">
          Sign in to sync your library, bookmarks and membership
        </p>
</section>
<!-- Sign In Form -->
<form class="space-y-space-lg" onsubmit="event.preventDefault();">
<!-- Email Input -->
<div class="space-y-1.5">
<label class="block font-label text-label text-text-secondary font-medium" for="email">
            Email
          </label>
<div class="relative">
<input autocomplete="email" class="w-full h-[52px] px-space-lg bg-surface text-text-primary font-body text-body rounded-[12px] border border-control-border placeholder-text-tertiary transition-all" id="email" name="email" placeholder="Enter your email" required="" type="email" value="ava.morgan@mail.com"/>
</div>
</div>
<!-- Password Input -->
<div class="space-y-1.5">
<label class="block font-label text-label text-text-secondary font-medium" for="password">
            Password
          </label>
<div class="relative">
<input autocomplete="current-password" class="w-full h-[52px] pl-space-lg pr-12 bg-surface text-text-primary font-body text-body rounded-[12px] border border-control-border placeholder-text-tertiary transition-all tracking-widest" id="password" name="password" placeholder="••••••••••••" required="" type="password" value="secretpassword123"/>
<button aria-label="Toggle password visibility" class="absolute right-3.5 top-1/2 -translate-y-1/2 text-text-secondary hover:text-text-primary p-1 rounded-full transition-colors flex items-center justify-center active:opacity-70" id="toggle-password" type="button">
<span class="material-symbols-outlined text-[20px]" id="eye-icon">visibility</span>
</button>
</div>
</div>
<!-- Forgot Password Action -->
<div class="flex justify-end pt-0.5">
<a class="font-label text-caption text-primary hover:text-accent-fill-pressed transition-colors font-medium active:opacity-80" href="#">
            Forgot password?
          </a>
</div>
<!-- Primary CTA Button -->
<div class="pt-space-sm">
<button class="w-full h-[56px] rounded-full bg-primary hover:bg-accent-fill-pressed active:bg-accent-fill-pressed text-on-primary font-label text-label font-medium shadow-button transition-all duration-150 flex items-center justify-center active:scale-[0.99]" type="submit">
            Sign in
          </button>
</div>
</form>
<!-- Separation Hairline Divider -->
<div class="relative my-space-xl flex items-center justify-center">
<div aria-hidden="true" class="absolute inset-0 flex items-center">
<div class="w-full border-t border-hairline-divider"></div>
</div>
<div class="relative px-space-md bg-background">
<span class="font-label text-caption text-text-tertiary font-normal">or</span>
</div>
</div>
<!-- Secondary Guest CTA -->
<button class="w-full h-[56px] rounded-full bg-surface hover:bg-surface-alt border-[1.5px] border-control-border text-text-primary font-label text-label font-medium transition-all duration-150 flex items-center justify-center active:scale-[0.99] active:opacity-90 shadow-sm" type="button">
        Continue as guest
      </button>
</div>
<!-- Bottom Footer Anchor -->
<footer class="pt-space-xl pb-space-xs text-center">
<p class="font-body text-body text-text-secondary">
        New here? 
        <a class="font-body text-body font-semibold text-primary hover:text-accent-fill-pressed transition-colors active:opacity-80 ml-1 inline-block" href="#">
          Create account
        </a>
</p>
</footer>
</main>
<!-- Interactive behavior for password toggle -->
<script>
    const toggleBtn = document.getElementById('toggle-password');
    const passwordInput = document.getElementById('password');
    const eyeIcon = document.getElementById('eye-icon');

    if (toggleBtn && passwordInput && eyeIcon) {
      toggleBtn.addEventListener('click', () => {
        const isPassword = passwordInput.getAttribute('type') === 'password';
        passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
        eyeIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
        
        if (!isPassword) {
          passwordInput.classList.add('tracking-widest');
        } else {
          passwordInput.classList.remove('tracking-widest');
        }
      });
    }
  </script>
